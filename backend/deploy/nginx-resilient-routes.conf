# nginx reverse proxy for the Resilient Routes API.
# Put this at /etc/nginx/sites-available/resilient-routes and symlink it into
# sites-enabled. Certbot will rewrite this to add the TLS (443) server block.
#
# Replace api.yourdomain.com with the subdomain that points (A record) at the
# EC2 instance's Elastic IP.

server {
    listen 80;
    server_name api.yourdomain.com;

    # Datasets are small JSON payloads, but allow room for the large graph.
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
